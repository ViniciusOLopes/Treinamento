{% extends "learning_logs/base.html" %}

{% block title %}
Nova Entrada - {{ topic }} | MeuDjango
{% endblock title %}

{% block content %}
<section style="
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 30px;
">
    <div style="width: 100%; max-width: 600px;">

        <div style="margin-bottom: 15px;">
            <a href="{% url 'topic' topic.id %}" style="
                color: #94a3b8;
                text-decoration: none;
                font-size: 15px;
            ">
                ← Voltar para {{ topic }}
            </a>
        </div>

        <h2 style="font-size: 36px; margin-bottom: 10px;">
            Nova <span style="color: #38bdf8;">Entrada</span>
        </h2>

        <p style="color: #94a3b8; font-size: 16px; margin-bottom: 25px;">
            Adicionando uma anotação em <strong>{{ topic }}</strong>.
        </p>

        <form action="{% url 'add_entry' topic.id %}" method="post" style="
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 25px;
            border-radius: 10px;
        ">
            {% csrf_token %}

            <div style="margin-bottom: 20px; font-size: 16px;">
                {{ form.as_p }}
            </div>

            <div style="display: flex; gap: 15px; align-items: center;">
                <button type="submit" name="submit" style="
                    background-color: #38bdf8;
                    color: #0f172a;
                    font-weight: bold;
                    padding: 12px 24px;
                    border: none;
                    border-radius: 8px;
                    cursor: pointer;
                    font-size: 16px;
                ">
                    Adicionar
                </button>

                <a href="{% url 'topic' topic.id %}" style="
                    color: #94a3b8;
                    text-decoration: none;
                    font-size: 15px;
                ">
                    Cancelar
                </a>
            </div>
        </form>

    </div>
</section>
{% endblock content %}
