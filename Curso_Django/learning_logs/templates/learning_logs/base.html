
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Meu Projeto{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* LINKS GERAIS */

        a,
        a:visited {
            color: #38bdf8;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        a:active {
            color: #0ea5e9;
        }

        /* BARRA SUPERIOR */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 10%;
            background: #1e293b;
        }

        header h1 {
            color: #38bdf8;
            font-size: 24px;
        }

        nav a,
        nav a:visited {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        nav a:active {
            color: #0ea5e9;
        }

        /* REGIÃO CENTRAL */

        main {
            flex: 1;
            width: 100%;
        }

        /* CARDS */

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px 10%;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 250px;
            text-align: center;
        }

        .card h3 {
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .card p {
            color: #94a3b8;
            line-height: 1.5;
        }

        /* BOTÕES */

        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:visited {
            color: white;
        }

        .btn:hover {
            background: #0369a1;
            color: white;
            transform: translateY(-3px);
        }

        /* RODAPÉ */

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin: 0 8px;
            }
        }

        /* ESTILOS ESPECÍFICOS DAS PÁGINAS */

    </style>
</head>

<body>

    <!-- BARRA SUPERIOR -->

    <header>
        <h1> <a href="/">MeuDjango.</a> </h1>

        <nav>
            <a href="/">Início</a>
            <a href="/sobre">Sobre</a>
            <a href="/admin">Admin</a>
            <a href="/topics">Topics</a>
        </nav>
    </header>

    <!-- REGIÃO CENTRAL -->

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- RODAPÉ -->

    {% block rodape %}
    <footer>
        <p>&copy; 2026 MeuDjango. Todos os direitos reservados.</p>
    </footer>
    {% endblock rodape %}

</body>
</html>
